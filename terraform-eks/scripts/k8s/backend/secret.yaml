apiVersion: v1
kind: Secret
metadata:
  name: firebase-secret
  labels:
    app: backend
type: Opaque
data:
  # Todos os valores já chegam em base64 (gerados pelo deploy-backend.sh / Terraform)
  FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_BASE64}
  # O FirebaseConfig do backend lê a propriedade "app.firebase.credentials-json",
  # que o Spring só preenche a partir desta variável de ambiente (APP_FIREBASE_...)
  APP_FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_BASE64}
  DB_USER: ${DB_USER_B64}
  DB_USERNAME: ${DB_USER_B64}
  SPRING_DATASOURCE_USERNAME: ${DB_USER_B64}
  DB_PASSWORD: ${DB_PASSWORD_B64}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_B64}
